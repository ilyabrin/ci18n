name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Warnings are errors in CI only. The Makefile stays warning-tolerant so a new
# compiler version cannot break a downstream build.
env:
  EXTRA_CFLAGS: -Werror

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # clang is not default on windows
          - os: windows-latest
            compiler: clang

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc clang make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      # `make` builds the example, then builds and runs the tests.
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: make CC=${{ matrix.compiler }}

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: mingw32-make

      - name: Run example (Unix)
        if: runner.os != 'Windows'
        run: ./example

      - name: Run example (Windows)
        if: runner.os == 'Windows'
        run: ./example.exe
