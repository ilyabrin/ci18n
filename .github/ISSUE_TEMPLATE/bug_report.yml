name: Bug report
description: Something does not work the way the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here. See
        [SECURITY.md](https://github.com/ilyabrin/ci18n/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: The input that triggers it
      description: |
        A translation file or a buffer literal is worth far more than a
        description. Every bug found in this library so far came down to exact
        bytes: a BOM, a CRLF, a line longer than the buffer. If the file matters,
        attach it rather than pasting it, so its line endings survive.
      render: text
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: The calls you make
      description: The shortest sequence of ci18n calls that shows the problem.
      render: c

  - type: input
    id: version
    attributes:
      label: ci18n version
      description: The value of CI18N_VERSION_STRING, or the commit you vendored.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      description: Output of `cc --version`, first line.
      placeholder: "gcc 13.2.0, or clang 18.1.3, or MSVC 19.40"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11 with MinGW"
    validations:
      required: true

  - type: dropdown
    id: standard
    attributes:
      label: Language standard
      options:
        - c99
        - c11
        - c17
        - other or not sure
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Macros you define before including the header
      description: |
        Any CI18N_MAX_* you changed from the default, plus
        CI18N_THREAD_LOCAL_CONTEXT or CI18N_DEF if you set them. The limits
        interact, so a changed one is often the whole answer.
      render: c
      placeholder: "#define CI18N_MAX_VALUE_LENGTH 65536"

  - type: textarea
    id: sanitizers
    attributes:
      label: Sanitizer output
      description: |
        If it crashes, a trace from AddressSanitizer or
        UndefinedBehaviorSanitizer usually identifies the line immediately:

        ```
        make test EXTRA_CFLAGS="-fsanitize=address,undefined -g"
        ```
      render: text
